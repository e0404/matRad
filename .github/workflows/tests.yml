# This is a basic workflow to help you get started with Actions
name: Tests

permissions:
  checks: write
  pull-requests: write
  actions: read
  contents: read

# Controls when the action will run. 
on: [push, pull_request, workflow_dispatch]  
jobs:
  test-matlab-stable: #Matlab test Job for supported Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # Checks-out repository under $GITHUB_WORKSPACE
        with:
          submodules: 'true'
      - name: Run Test
        uses: ./.github/actions/test-matlab
        with:
          matlab-version: R2022b

  test-matlab-latest: #Matlab test Job for latest Matlab release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # Checks-out repository under $GITHUB_WORKSPACE
        with:
          submodules: 'true'
      - uses: ./.github/actions/test-matlab
        with:
          matlab-version: latest

  test-octave-8: #Octave test Job
    runs-on: ubuntu-24.04 # We use Ubuntu-24.04 because of Octave 8.4.0, for which we build ipopt
    steps:
      - uses: actions/checkout@v7 # Checks-out repository under $GITHUB_WORKSPACE
        with:
          submodules: 'true'
      - uses: ./.github/actions/test-octave
  
  coverage-report:
    name: Collect Coverage Report
    needs: [test-matlab-stable]
    uses: ./.github/workflows/coverage-report.yml
    secrets: inherit

  event_file:
    name: Event File
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}