name: 'Octave Test'
author: 'e0404'
description: 'Runs an Octave test. Uses the version in the respective Ubuntu-OS'

runs:
  using: 'composite'
  steps:
    - name: Install OCTAVE
      shell: bash
      run: |
        sudo apt update
        sudo apt-get install -y gdb gfortran fonts-freefont-otf gnuplot-x11 libgdcm-dev octave octave-dev
    - name: Prepare Test Environment
      shell: bash
      run: |
        sudo chmod +x .github/before_install_linux.sh
        sudo .github/before_install_linux.sh
    # ompMC is GPL licensed and therefore not shipped with matRad, so the
    # photon Monte Carlo example has nothing to run until it is installed.
    # Accepting its license on behalf of the runner is what a person would
    # otherwise be asked for interactively.
    - name: Install ompMC
      shell: bash
      run: xvfb-run -a octave-cli --no-gui --eval "matRad_rc; matRad_installOmpMC('acceptLicense',true);"
    - name: Run Tests
      shell: bash
      run: xvfb-run -a .github/runtests.sh octave-cli
      # uses: GabrielBB/xvfb-action@v1 #For Headless tests
      # with:
      #   run: .github/runtests.sh octave-cli
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-octave
        path: testresults.xml

    - name: Publish Test Results
      # uses: EnricoMi/publish-unit-test-result-action@v2
      uses: test-summary/action@v2
      if: success() || failure()
      with:
        # files: |
        #   testresults.xml
        paths: testresults.xml
        # check_name: "${{ github.job }}"
